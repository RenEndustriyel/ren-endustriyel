name: Günlük Veritabanı Yedeği

on:
  schedule:
    # Her sabah 05:00 UTC (Türkiye saatiyle 08:00)
    - cron: '0 5 * * *'
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Canlı Veritabanı Yedeğini Al
        run: |
          mkdir -p backups
          node scripts/backup-daily.mjs --folder "./backups" --mode dated
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Yedek Dosyasını GitHub Artifact Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: ren-muhasebe-yedek-${{ github.sha }}
          path: backups/
          retention-days: 90
